[package]
name = "polyglot_parallel"
version = "0.1.0"
edition = "2021"
authors = ["AllToolkit"]
description = "Parallel snippet runner — forks N processes, each printing a language banner, then reports peak RSS memory"
license = "MIT"
keywords = ["parallel", "subprocess", "banner", "process", "fork"]
categories = ["utility", "algorithms"]
repository = "https://github.com/AllToolkit/AllToolkit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"