[package]
name = "polyglot_epic_saga"
version = "0.1.0"
edition = "2021"
authors = ["AllToolkit"]
description = "Epic narrative generator — treats each programming language as an epic hero on an odyssey, generating narrative poetry about legendary battles, companions, and prophetic destiny"
license = "MIT"
keywords = ["polyglot", "epic", "saga", "narrative", "language"]
categories = ["utility", "text-generation"]
repository = "https://github.com/AllToolkit/AllToolkit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
