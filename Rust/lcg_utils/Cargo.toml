[package]
name = "lcg_utils"
version = "0.1.0"
edition = "2021"
authors = ["AllToolkit"]
description = "Linear Congruential Generator toolkit — classic PRNG algorithms, parameter search, statistical tests, and visualization"
license = "MIT"
keywords = ["prng", "random", "lcg", "linear-congruential", "rng", "simulation"]
categories = ["algorithms", "simulation", "math"]
repository = "https://github.com/AllToolkit/AllToolkit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"