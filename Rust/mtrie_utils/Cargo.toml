[package]
name = "mtrie_utils"
version = "0.1.0"
edition = "2021"
authors = ["AllToolkit"]
license = "MIT"
description = "Mutable trie (prefix tree) with fuzzy matching, autocomplete, and serialization — zero dependencies"
keywords = ["trie", "prefix-tree", "autocomplete", "fuzzy-match", "data-structure"]
categories = ["algorithms", "data-structures"]
repository = "https://github.com/AllToolkit/AllToolkit"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "mtrie_utils"
path = "src/lib.rs"

[[example]]
name = "usage_examples"
path = "examples/usage_examples.rs"
