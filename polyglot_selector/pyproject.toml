[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot_selector"
version = "0.1.0"
description = "Language rotation selector with challenge generator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
polyglot-selector = "polyglot_selector.src.selector:main"

[tool.pytest.ini_options]
testpaths = ["tests"]