[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot_voyager"
version = "0.1.0"
description = "Tracks the multi-stop journey of language learning across the polyglot ecosystem"
requires-python = ">=3.10"
dependencies = ["pytest>=7.0"]

[project.scripts]
polyglot-voyager = "polyglot_voyager.src.journey:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
