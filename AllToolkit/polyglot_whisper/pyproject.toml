[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot_whisper"
version = "0.1.0"
description = "Generates insight cards (idioms, proverbs, quirks) for rotated languages"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
polyglot-whisper = "polyglot_whisper.src.whisper:main"

[tool.pytest.ini_options]
testpaths = ["tests"]